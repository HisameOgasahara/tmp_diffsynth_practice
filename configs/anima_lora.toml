# irodori_test/anima_lora_cli_colab.ipynb에서 사용한 일반 LoRA 기본값을
# 이 저장소의 anima_core.training 설정 형식에 맞춰 옮긴 설정입니다.
# 이 저장소가 지원하지 않는 Irodori 전용 기능은 포함하지 않습니다.

[dataset]
resolution = 512
batch_size = 4
repeat = 2
caption_dropout_rate = 0.1

[lora]
base_model = "dit"
rank = 32
alpha = 128
# 현재 trainer가 빈 문자열일 때 학습 가능한 Linear LoRA 대상을 자동 선택합니다.
target_modules = ""

[training]
optimizer = "AdamW"
learning_rate = 2e-5
# Irodori의 AdamW에 별도 optimizer_args가 없어서 torch.optim.AdamW 기본값과 동일합니다.
weight_decay = 0.01
lr_scheduler = "cosine"
warmup_ratio = 0.05
max_steps = 2400
gradient_accumulation_steps = 1
seed = 42

[runtime]
mixed_precision = "bf16"
use_gradient_checkpointing = true

[checkpoint]
save_steps = 200
